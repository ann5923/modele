name: Build Veiled Intro

on:
  push:
    branches: [codex/intro-build-20261006]
    paths:
      - .github-upload/*.b64
      - .github/workflows/veiled-intro.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reassemble source archive
        run: python3 -c "import base64,pathlib; p=sorted(pathlib.Path('.github-upload').glob('part*.b64')); pathlib.Path('veiled-intro-source.zip').write_bytes(base64.b64decode(b''.join(x.read_bytes() for x in p)))"
      - name: Unpack mod source
        run: unzip -q veiled-intro-source.zip -d veiled-intro
      - name: Build mod
        working-directory: veiled-intro
        run: chmod +x gradlew && ./gradlew --no-daemon build
      - name: Upload Fabric mod jar
        uses: actions/upload-artifact@v4
        with:
          name: veiled-intro-minecraft-1.21.4
          path: veiled-intro/build/libs/veiled-intro-0.1.0.jar
          if-no-files-found: error
          retention-days: 30
